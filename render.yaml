services:
  - type: web
    name: healthcoach-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: HealthCoachBackend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: USER_ID
        sync: false
      - key: IMPORT_API_TOKEN
        sync: false
      - key: AUTO_IMPORT_SESSIONS_ON_STARTUP
        value: "false"
      - key: SESSIONS_CSV_POLL_SECONDS
        value: "0"
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: llama3
      - key: OLLAMA_TIMEOUT_SECONDS
        value: "90"
  - type: web
    name: healthcoach-streamlit
    runtime: python
    plan: free
    region: frankfurt
    rootDir: HealthCoachBackend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEFAULT_USER_ID
        sync: false
      - key: USER_ID
        sync: false
